name: flutter_ludo
description: "A complete Ludo game for Flutter: rules engine, animated board and dice, smart bots (easy/medium/hard), 2v2 teams, configurable rules, and save/restore."
version: 0.2.0
homepage: https://github.com/rojanparajuli/Flutter_ludo
repository: https://github.com/rojanparajuli/Flutter_ludo
issue_tracker: https://github.com/rojanparajuli/Flutter_ludo/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

topics:
  - ludo
  - game
  - board-game
  - bot
  - multiplayer

screenshots:
  - description: "A 4-player Ludo game in progress."
    path: assets/ss.jpg

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
